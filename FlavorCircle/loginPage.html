<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Akun — FlavorCircle</title>
    <link rel="icon" href="assets/images/FC_logo.png" type="image/png">
    
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            background: radial-gradient(circle at top right, #fff4ed 0%, var(--bg-page) 60%);
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background-color: #fff;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg);
        }

        .auth-brand-head {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo {
            height: 48px;
            margin: 0 auto 0.75rem auto;
            object-fit: contain;
        }

        .auth-title {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 0.35rem;
        }

        .auth-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: var(--bg-card-subtle);
            border-radius: var(--radius-md);
            padding: 0.3rem;
            margin-bottom: 1.75rem;
        }

        .auth-tab-btn {
            padding: 0.55rem;
            text-align: center;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
        }

        .auth-tab-btn.active {
            background-color: #fff;
            color: var(--primary);
            box-shadow: var(--shadow-xs);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 0.4rem;
        }

        .input-with-icon {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-icon i {
            position: absolute;
            left: 1rem;
            font-size: 1.15rem;
            color: var(--text-light);
        }

        .auth-input {
            width: 100%;
            background-color: var(--bg-card-subtle);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            font-size: 0.9rem;
            transition: all var(--transition-fast);
        }

        .auth-input:focus {
            background-color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(226, 88, 34, 0.15);
        }

        .form-options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            margin-bottom: 1.5rem;
        }

        .remember-checkbox {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary);
            font-weight: 600;
        }

        .btn-auth-submit {
            width: 100%;
            background-color: var(--primary);
            color: #fff;
            padding: 0.85rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all var(--transition-fast);
            box-shadow: 0 4px 12px rgba(226, 88, 34, 0.3);
        }

        .btn-auth-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 1.75rem 0;
            color: var(--text-light);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border-light);
        }

        .auth-divider span {
            padding: 0 0.85rem;
        }

        .sso-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .btn-sso {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: #fff;
            border: 1px solid var(--border-light);
            padding: 0.65rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            transition: all var(--transition-fast);
        }

        .btn-sso:hover {
            background-color: var(--bg-card-subtle);
            border-color: var(--border-hover);
        }

        .back-home-link {
            display: block;
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .back-home-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-brand-head">
            <a href="index.html">
                <img src="assets/images/FC_logo.png" alt="FlavorCircle" class="auth-logo">
            </a>
            <h1 class="auth-title">Selamat Datang Kembali</h1>
            <p class="auth-subtitle">Masuk untuk memesan hidangan favorit di kampus.</p>
        </div>

        <div class="auth-tabs">
            <a href="loginPage.html" class="auth-tab-btn active">Masuk</a>
            <a href="signup.html" class="auth-tab-btn">Daftar</a>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="username">Username atau Email Binus</label>
                <div class="input-with-icon">
                    <i class='bx bx-user'></i>
                    <input type="text" id="username" class="auth-input" placeholder="contoh: francis.hasnawi@binus.ac.id" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Kata Sandi</label>
                <div class="input-with-icon">
                    <i class='bx bx-lock-alt'></i>
                    <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-options-row">
                <label class="remember-checkbox">
                    <input type="checkbox" checked>
                    <span>Ingat saya di perangkat ini</span>
                </label>
                <a href="#" class="forgot-link" onclick="alert('Instruksi pemulihan kata sandi telah dikirim ke email kampus Anda!')">Lupa Sandi?</a>
            </div>

            <button type="submit" class="btn-auth-submit">
                <span>Masuk Sekarang</span>
                <i class='bx bx-right-arrow-alt'></i>
            </button>
        </form>

        <div class="auth-divider">
            <span>Atau Masuk Dengan</span>
        </div>

        <div class="sso-buttons">
            <button class="btn-sso" onclick="mockSSO('Google')">
                <i class='bx bxl-google' style="color: #ea4335;"></i>
                <span>Google</span>
            </button>
            <button class="btn-sso" onclick="mockSSO('Binus SSO')">
                <i class='bx bxs-graduation' style="color: #e25822;"></i>
                <span>Binus SSO</span>
            </button>
        </div>

        <a href="index.html" class="back-home-link">
            <i class='bx bx-arrow-back'></i> Kembali ke Beranda FlavorCircle
        </a>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            alert(`Selamat datang kembali, ${user}! Anda berhasil masuk.`);
            window.location.href = 'index.html';
        }

        function mockSSO(provider) {
            alert(`Berhasil masuk menggunakan akun ${provider}.`);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
