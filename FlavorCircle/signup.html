<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun — FlavorCircle</title>
    <link rel="icon" href="assets/images/FC_logo.png" type="image/png">
    
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
            background: radial-gradient(circle at top right, #fff4ed 0%, var(--bg-page) 60%);
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background-color: #fff;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg);
        }

        .auth-brand-head {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo {
            height: 48px;
            margin: 0 auto 0.75rem auto;
            object-fit: contain;
        }

        .auth-title {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 0.35rem;
        }

        .auth-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: var(--bg-card-subtle);
            border-radius: var(--radius-md);
            padding: 0.3rem;
            margin-bottom: 1.75rem;
        }

        .auth-tab-btn {
            padding: 0.55rem;
            text-align: center;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
        }

        .auth-tab-btn.active {
            background-color: #fff;
            color: var(--primary);
            box-shadow: var(--shadow-xs);
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 0.4rem;
        }

        .input-with-icon {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-icon i {
            position: absolute;
            left: 1rem;
            font-size: 1.15rem;
            color: var(--text-light);
        }

        .auth-input {
            width: 100%;
            background-color: var(--bg-card-subtle);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            font-size: 0.9rem;
            transition: all var(--transition-fast);
        }

        .auth-input:focus {
            background-color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(226, 88, 34, 0.15);
        }

        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .btn-auth-submit {
            width: 100%;
            background-color: var(--primary);
            color: #fff;
            padding: 0.85rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all var(--transition-fast);
            box-shadow: 0 4px 12px rgba(226, 88, 34, 0.3);
        }

        .btn-auth-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .back-home-link {
            display: block;
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .back-home-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-brand-head">
            <a href="index.html">
                <img src="assets/images/FC_logo.png" alt="FlavorCircle" class="auth-logo">
            </a>
            <h1 class="auth-title">Daftar Akun Baru</h1>
            <p class="auth-subtitle">Bergabung dengan komunitas kuliner kampus terbesar.</p>
        </div>

        <div class="auth-tabs">
            <a href="loginPage.html" class="auth-tab-btn">Masuk</a>
            <a href="signup.html" class="auth-tab-btn active">Daftar</a>
        </div>

        <form onsubmit="handleSignup(event)">
            <div class="form-group">
                <label class="form-label" for="regName">Nama Lengkap</label>
                <div class="input-with-icon">
                    <i class='bx bx-user'></i>
                    <input type="text" id="regName" class="auth-input" placeholder="contoh: Francis Jordan Hasnawi" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="regEmail">Email Kampus atau Pribadi</label>
                <div class="input-with-icon">
                    <i class='bx bx-envelope'></i>
                    <input type="email" id="regEmail" class="auth-input" placeholder="nama@binus.ac.id" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="regPassword">Kata Sandi Baru</label>
                <div class="input-with-icon">
                    <i class='bx bx-lock-alt'></i>
                    <input type="password" id="regPassword" class="auth-input" placeholder="Minimal 8 karakter" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="regConfirmPassword">Konfirmasi Kata Sandi</label>
                <div class="input-with-icon">
                    <i class='bx bx-check-shield'></i>
                    <input type="password" id="regConfirmPassword" class="auth-input" placeholder="Ulangi kata sandi" required>
                </div>
            </div>

            <label class="terms-row">
                <input type="checkbox" required style="margin-top: 2px;">
                <span>Saya menyetujui Ketentuan Layanan & Kebijakan Privasi FlavorCircle Indonesia.</span>
            </label>

            <button type="submit" class="btn-auth-submit">
                <span>Daftar Sekarang</span>
                <i class='bx bx-right-arrow-alt'></i>
            </button>
        </form>

        <a href="index.html" class="back-home-link">
            <i class='bx bx-arrow-back'></i> Kembali ke Beranda FlavorCircle
        </a>
    </div>

    <script>
        function handleSignup(e) {
            e.preventDefault();
            const p1 = document.getElementById('regPassword').value;
            const p2 = document.getElementById('regConfirmPassword').value;
            if (p1 !== p2) {
                alert("Kata sandi dan konfirmasi kata sandi tidak cocok!");
                return;
            }
            alert("Pendaftaran berhasil! Akun FlavorCircle Anda siap digunakan.");
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
